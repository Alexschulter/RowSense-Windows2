name: Build RowSense Windows .NET

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RowSenseWindows.csproj

      - name: Publish Windows x64
        run: dotnet publish RowSenseWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RowSense-Windows-DotNet-x64
          path: publish/
          if-no-files-found: error
