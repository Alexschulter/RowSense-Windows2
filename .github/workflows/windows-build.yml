name: Build RowSense Windows .NET

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find project
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "*.csproj"

      - name: Restore
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "RowSenseWindows.csproj" | Select-Object -First 1
          if (-not $proj) {
            throw "RowSenseWindows.csproj not found"
          }
          Write-Host "Project found: $($proj.FullName)"
          dotnet restore "$($proj.FullName)"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "RowSenseWindows.csproj" | Select-Object -First 1
          if (-not $proj) {
            throw "RowSenseWindows.csproj not found"
          }
          dotnet publish "$($proj.FullName)" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:GITHUB_WORKSPACE\publish"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RowSense-Windows-DotNet-x64
          path: publish/
          if-no-files-found: error
